# Nginx Reverse Proxy Configuration for Enterprise RAG Chatbot
# Place in /etc/nginx/sites-available/ragchat and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name chat.example.com;

    # Redirect all HTTP traffic to HTTPS (recommended)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.example.com;

    # SSL Certificate Paths (Let's Encrypt or custom CA)
    ssl_certificate /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Maximum file upload size (documents/images)
    client_max_body_size 25m;

    # Logging
    access_log /var/log/nginx/ragchat_access.log;
    error_log /var/log/nginx/ragchat_error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & EventSource (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CRITICAL for Server-Sent Events (SSE): disable proxy buffering
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts for long AI generation / large document ingestion
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
