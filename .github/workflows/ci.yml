name: CI Cross-Platform Test Suite

on:
  push:
    branches: [ main, "release/**", "feature/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install CPU-only PyTorch (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache Hugging Face & OCR Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.EasyOCR
            ${{ env.LOCALAPPDATA }}/huggingface
          key: models-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('scripts/download_models.py') }}
          restore-keys: |
            models-${{ runner.os }}-${{ matrix.python-version }}-
            models-${{ runner.os }}-

      - name: Run Setup Script
        run: |
          python scripts/setup.py

      - name: Pre-download AI Models
        run: |
          python scripts/download_models.py

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Create Throwaway Administrator
        run: |
          python scripts/create_admin.py --email admin@test.local --password SmokeTestAdminPass123!

      - name: Smoke Test (Linux)
        if: runner.os == 'Linux'
        env:
          ADMIN_EMAIL: admin@test.local
          ADMIN_PASSWORD: SmokeTestAdminPass123!
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 5
          python scripts/smoke_test.py --url http://127.0.0.1:8000
          kill $SERVER_PID || true

      - name: Smoke Test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $proc = Start-Process python -ArgumentList "-m", "uvicorn", "backend.main:app", "--host", "127.0.0.1", "--port", "8000" -PassThru
          Start-Sleep -Seconds 8
          $env:ADMIN_EMAIL = "admin@test.local"
          $env:ADMIN_PASSWORD = "SmokeTestAdminPass123!"
          try {
            python scripts/smoke_test.py --url http://127.0.0.1:8000
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
